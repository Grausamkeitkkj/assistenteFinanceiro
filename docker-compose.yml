version: '3.8'

services:
  app:
    build: .
    container_name: php_app
    restart: always
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "8000:80" # Aplicação PHP acessível em http://localhost:8000
    networks:
      - app-network

  db:
    image: mysql:8.0
    container_name: php_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: assistenteFinanceiro
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: php_myadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8080:80" # phpMyAdmin acessível em http://localhost:8080
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge